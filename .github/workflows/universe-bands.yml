name: Universe Bands
on:
  workflow_dispatch:
    inputs:
      bands:
        default: "small:500:5000,micro:100:500"
      n:
        default: "70"
permissions:
  contents: write
jobs:
  go:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - env:
          BANDS: ${{ github.event.inputs.bands }}
          N: ${{ github.event.inputs.n }}
        run: python scripts/universe_bands.py
      - name: save result
        if: always()
        run: |
          git config user.name "market-bot"; git config user.email "bot@users.noreply.github.com"
          git add -f companydata/_readiness
          git diff --cached --quiet || git commit -qm "data: universe bands"
          for i in 1 2 3; do git pull -q --rebase origin main && git push -q origin HEAD:main && break || sleep 5; done
