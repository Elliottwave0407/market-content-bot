name: esm-snapshot
on:
  workflow_dispatch:
  schedule:
    - cron: "20 * * * *"      # hourly: store NSE's ESM / ASM / GSM lists when they change (posts nothing)
permissions:
  contents: write
concurrency:
  group: esm-snapshot
  cancel-in-progress: false
jobs:
  a:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests
      - run: python scripts/esm_snapshot.py
      - name: Save snapshot
        if: always()
        run: |
          git config user.name market-content-bot && git config user.email bot@users.noreply.github.com
          git add store/esm 2>/dev/null || true
          git diff --cached --quiet && exit 0
          git commit -q -m "ESM/ASM/GSM list snapshot"
          for i in 1 2 3 4; do git pull --rebase -q origin main && git push -q origin main && break; sleep 4; done
