# read-only RCA: pull result PDFs of given BSE scrip codes (for a day) and dump how the rule reader sees them (posts nothing)
name: rca-codes
on:
  workflow_dispatch:
    inputs:
      codes:
        description: "BSE scrip codes, comma separated"
        default: "507984,500013,517077,544351,544956,513721"
      day:
        description: "filing day YYYY-MM-DD (empty = today IST)"
        default: ""
permissions:
  contents: read
jobs:
  a:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt
      - run: pip install -r requirements.txt rapidocr-onnxruntime
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq tesseract-ocr
      - env:
          RULE_OCR_ENGINE: rapid
          CODES: ${{ github.event.inputs.codes }}
          DAY: ${{ github.event.inputs.day }}
        run: python scripts/rca_codes.py
