name: rule-dump
on:
  workflow_dispatch:
    inputs:
      only:
        description: "name fragments"
        default: ""
      reason:
        description: "only failures containing this text"
        default: ""
      n:
        description: "how many"
        default: "5"
      skip:
        description: "skip"
        default: "0"
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt
      - run: pip install -r requirements.txt
      - env:
          DAYS: "1,2"
          MAXN: "80"
          REASON: ${{ github.event.inputs.reason }}
          ONLY: ${{ github.event.inputs.only }}
          N: ${{ github.event.inputs.n }}
          SKIP: ${{ github.event.inputs.skip }}
        run: python scripts/rule_dump.py
