name: prices2-check
on:
  workflow_dispatch:
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt pandas numpy
      - uses: actions/cache@v4
        with:
          path: data/prices2
          key: univ-prices-${{ github.run_id }}
          restore-keys: univ-prices-
      - run: python scripts/prices2_check.py
