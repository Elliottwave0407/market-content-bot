name: results-poll
on:
  workflow_dispatch:
    inputs:
      send:
        description: "1 = post to Telegram group, 0 = dry run"
        default: "0"
      minutes:
        description: "how long this run keeps polling (max ~345)"
        default: "345"
permissions:
  contents: write
  actions: write
concurrency:
  group: results-poll-${{ github.event.inputs.send == '1' && 'live' || 'dry' }}
  cancel-in-progress: false
jobs:
  poll:
    runs-on: ubuntu-latest
    timeout-minutes: 355
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt
      - run: pip install -r requirements.txt
      - name: Poll BSE result filings (loop)
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          POLL_SEND: ${{ github.event.inputs.send || '0' }}
          POLL_LOOP_MINUTES: ${{ github.event.inputs.minutes || '345' }}
          POLL_INTERVAL: "10"
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_API_KEY_OVERFLOW: ${{ secrets.GEMINI_API_KEY_CONCALL }}   # used ONLY when every model on the main key is out of quota
          TELEGRAM_RESULTS_CHANNEL_ID: ${{ secrets.TELEGRAM_RESULTS_CHANNEL_ID }}   # optional second audience: full cards only, Filing button only
          NVIDIA_API_KEY: ${{ secrets.NVIDIA_API_KEY }}
          MARKET_CHAT_ID: ${{ secrets.TELEGRAM_NEWS_CHAT_ID }}
          TELEGRAM_ANALYSIS_CHAT_ID: ${{ secrets.TELEGRAM_ANALYSIS_CHAT_ID }}
          NEWS_LIVE: "1"
          SME_LIVE: "1"
          FIN_LIVE: "1"
        run: python scripts/poll_loop.py
      - name: Start the next run (chain)
        if: always() && github.event.inputs.send == '1'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api -X POST repos/${{ github.repository }}/actions/workflows/results-poll.yml/dispatches -f ref=main -f 'inputs[send]=1' -f 'inputs[minutes]=345'
