name: results-poll
on:
  workflow_dispatch:
    inputs:
      send:
        description: "1 = post to Telegram group, 0 = dry run"
        default: "0"
permissions:
  contents: write
concurrency:
  group: results-poll
  cancel-in-progress: false
jobs:
  poll:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install bse requests matplotlib
      - name: Poll BSE result filings
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          POLL_SEND: ${{ github.event.inputs.send || '0' }}
        run: python scripts/results_poller.py
      - name: Save state and previews
        run: |
          git config user.name "market-content-bot"
          git config user.email "bot@users.noreply.github.com"
          git add state drafts/poll
          git diff --cached --quiet || (git commit -m "Poller state and previews" && git pull --rebase -q origin main && git push -q origin main)
