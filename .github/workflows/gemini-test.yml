name: gemini-test
on:
  workflow_dispatch:
    inputs:
      codes:
        description: "BSE scrip codes, comma separated"
        default: "543895,543378"
      since:
        description: "results filed from (YYYY-MM-DD)"
        default: "2026-01-01"
permissions:
  contents: write
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt
      - run: pip install -r requirements.txt
      - env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          CODE: ${{ github.event.inputs.codes }}
          SINCE: ${{ github.event.inputs.since }}

        run: python scripts/gemini_test.py
      - name: Publish preview PNG to the preview-cards branch
        if: always()
        run: |
          set -e
          [ -d out ] || exit 0
          mkdir /tmp/pv && cp out/*.png /tmp/pv/ 2>/dev/null || exit 0
          cd /tmp/pv
          git init -q && git checkout -q -b preview-cards
          git config user.name market-content-bot && git config user.email bot@users.noreply.github.com
          git add . && git commit -q -m "preview cards"
          git push -q -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" preview-cards
