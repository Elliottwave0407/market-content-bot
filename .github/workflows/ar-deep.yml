name: ar-deep
on:
  workflow_dispatch:
    inputs:
      isins:
        description: "comma list of ISINs (blank = next in list)"
        default: ""
      dry:
        default: "1"
      maxn:
        default: "5"
      budget_min:
        default: "60"
concurrency:
  group: ar-deep
  cancel-in-progress: false
permissions:
  contents: write
jobs:
  r:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt && sudo apt-get install -y poppler-utils >/dev/null
      - env:
          NVIDIA_API_KEY: ${{ secrets.NVIDIA_API_KEY }}
          OUT_DIR: ${{ (github.event.inputs.dry || '1') == '1' && 'annual_report_deep_dry' || 'annual_report_deep' }}
          ISINS: ${{ github.event.inputs.isins }}
          MAXN: ${{ github.event.inputs.maxn || '5' }}
          BUDGET_MIN: ${{ github.event.inputs.budget_min || '60' }}
        run: python scripts/ar_deep.py
      - name: Save
        if: always()
        run: |
          git config user.name market-content-bot && git config user.email bot@users.noreply.github.com
          git add store/annual_report_deep_dry 2>/dev/null || true; git add store/annual_report_deep 2>/dev/null || true
          git diff --cached --quiet && exit 0
          git commit -q -m "Annual report deep facts"
          for i in 1 2 3 4; do git pull --rebase -q origin main && git push -q origin main && break; sleep 4; done
