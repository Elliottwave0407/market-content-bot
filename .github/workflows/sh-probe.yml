name: sh-probe
on:
  workflow_dispatch:
    inputs:
      symbol:
        description: "NSE symbol"
        default: "SKYGOLD"
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - env:
          SYMBOL: ${{ github.event.inputs.symbol }}
        run: python scripts/sh_probe.py && python scripts/sh_xbrl.py
      - name: save data
        run: |
          git config user.name "market-bot"; git config user.email "bot@users.noreply.github.com"
          git add companydata/_sh
          git diff --cached --quiet || git commit -qm "data: shareholding probe ${{ github.event.inputs.symbol }}"
          for i in 1 2 3; do git pull -q --rebase origin main && git push -q origin HEAD:main && break || sleep 5; done
