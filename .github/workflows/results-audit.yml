name: results-audit
on:
  workflow_dispatch:
    inputs:
      days:
        description: "days back"
        default: "7"
permissions:
  contents: read
jobs:
  a:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - env:
          AUDIT_DAYS: ${{ github.event.inputs.days || '7' }}
        run: python scripts/results_audit.py
