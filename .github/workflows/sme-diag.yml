name: sme-diag
on:
  workflow_dispatch:
    inputs:
      codes:
        description: "BSE scrip codes"
        default: ""
      since:
        description: "from date"
        default: "2026-10-15"
permissions:
  contents: write
jobs:
  d:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - name: Diagnose (nothing is posted)
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_API_KEY_OVERFLOW: ${{ secrets.GEMINI_API_KEY_CONCALL }}
          GEMINI_API_KEY_RESULTS: ${{ secrets.GEMINI_API_IMAGE_SCANNED_RESULTS }}
          CODES: ${{ github.event.inputs.codes }}
          FROM: ${{ github.event.inputs.since }}
        run: python -u scripts/sme_diag.py
      - name: Save
        if: always()
        run: |
          git config user.name market-content-bot && git config user.email bot@users.noreply.github.com
          git add store/sme_diag 2>/dev/null || true
          git diff --cached --quiet && exit 0
          git commit -q -m "SME diag"
          for i in 1 2 3 4; do git pull --rebase -q origin main && git push -q origin main && break; sleep 4; done
