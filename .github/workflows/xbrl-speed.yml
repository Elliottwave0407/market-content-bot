name: xbrl-speed
on:
  workflow_dispatch:
    inputs:
      day:
        default: "2026-10-21"
      n:
        default: "40"
permissions:
  contents: read
jobs:
  go:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - env:
          XBRL_DAY: ${{ github.event.inputs.day }}
          XBRL_N: ${{ github.event.inputs.n }}
        run: python scripts/xbrl_speed.py
