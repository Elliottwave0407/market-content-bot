name: compare-extract
on:
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: compare-extract
jobs:
  c:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - env:
          NVIDIA_API_KEY: ${{ secrets.NVIDIA_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          N_DOCS: "10"
        run: python scripts/compare_extract.py
      - name: Save comparison
        if: always()
        run: |
          git config user.name market-content-bot && git config user.email bot@users.noreply.github.com
          git add store/concall_compare 2>/dev/null || true
          git diff --cached --quiet && exit 0
          git commit -q -m "Concall extraction comparison"
          for i in 1 2 3 4; do git pull --rebase -q origin main && git push -q origin main && break; sleep 4; done
