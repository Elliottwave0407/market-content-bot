# read-only debug of one filing PDF (posts nothing)
name: pdf-url-debug
on:
  workflow_dispatch:
    inputs:
      url:
        description: "PDF url"
        default: ""
      hint:
        description: "headline text (optional)"
        default: ""
      qhint:
        description: "BSE quarter code (Sep-26 = 131), optional"
        default: ""
permissions:
  contents: read
jobs:
  a:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt
      - run: pip install -r requirements.txt rapidocr-onnxruntime
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq tesseract-ocr
      - env:
          RULE_OCR_ENGINE: rapid
          URL: ${{ github.event.inputs.url }}
          HINT: ${{ github.event.inputs.hint }}
          QHINT: ${{ github.event.inputs.qhint }}
        run: python scripts/pdf_url_debug.py
