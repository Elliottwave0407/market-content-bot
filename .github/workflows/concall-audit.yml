name: concall-audit
on:
  workflow_dispatch:
    inputs:
      per_group:
        description: "facts judged per reader group"
        default: "60"
  schedule:
    - cron: "50 1,4,7,10,13,16,19,22 * * *"   # every 3 hours, alongside the extraction chain
permissions:
  contents: write
concurrency:
  group: concall-audit
  cancel-in-progress: false
jobs:
  a:
    runs-on: ubuntu-latest
    timeout-minutes: 70
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt
      - run: pip install -r requirements.txt
      - env:
          GEMINI_API_KEY_CONCALL: ${{ secrets.GEMINI_API_KEY_CONCALL }}
          PER_GROUP: ${{ github.event.inputs.per_group || '60' }}
        run: python scripts/concall_audit.py
      - name: Save audit
        if: always()
        run: |
          git config user.name market-content-bot && git config user.email bot@users.noreply.github.com
          git add store/concall_audit 2>/dev/null || true
          git diff --cached --quiet && exit 0
          git commit -q -m "Concall audit results"
          for i in 1 2 3 4; do git pull --rebase -q origin main && git push -q origin main && break; sleep 4; done
