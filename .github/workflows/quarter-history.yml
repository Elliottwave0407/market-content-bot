name: Quarter History
on:
  workflow_dispatch:
    inputs:
      symbols:
        description: "Optional comma list (blank = all screened companies)"
        default: ""
      symfile:
        description: "optional: repo path of a universe json (e.g. companydata/_readiness/universe_smallcap.json)"
        default: ""
      nshards:
        default: "4"
permissions:
  contents: write
jobs:
  go:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - env:
          SYMBOLS: ${{ github.event.inputs.symbols }}
          SYMFILE: ${{ github.event.inputs.symfile }}
          SHARD: ${{ matrix.shard }}
          NSHARDS: "4"
        run: python scripts/quarter_history.py
      - name: save result
        if: always()
        run: |
          git config user.name "market-bot"; git config user.email "bot@users.noreply.github.com"
          git add -f companydata/_hist
          git diff --cached --quiet || git commit -qm "data: quarter history shard ${{ matrix.shard }}"
          for i in 1 2 3 4 5; do git pull -q --rebase origin main && git push -q origin HEAD:main && break || sleep 6; done
