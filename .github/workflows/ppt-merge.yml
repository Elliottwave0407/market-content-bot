name: ppt-merge
on:
  workflow_dispatch:
    inputs:
      from_day:
        description: "first day to check"
        default: "2024-04-01"
      budget_min:
        default: "140"
concurrency:
  group: ppt-merge
  cancel-in-progress: false
permissions:
  contents: write
jobs:
  c:
    runs-on: ubuntu-latest
    timeout-minutes: 175
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - env:
          FROM: ${{ github.event.inputs.from_day }}
          BUDGET_MIN: ${{ github.event.inputs.budget_min }}
        run: python scripts/ppt_merge.py
      - name: Save
        if: always()
        run: |
          git config user.name market-content-bot && git config user.email bot@users.noreply.github.com
          git add store/ppt_listing 2>/dev/null || true
          git diff --cached --quiet && exit 0
          git commit -q -m "Presentation listing"
          for i in 1 2 3 4; do git pull --rebase -q origin main && git push -q origin main && break; sleep 4; done
