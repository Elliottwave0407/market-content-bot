name: concall-daily
on:
  schedule:
    - cron: "30 18 * * *"      # 00:00 IST every night: transcripts filed that day and the previous two days
  workflow_dispatch:
concurrency:
  group: concall-daily
  cancel-in-progress: false
permissions:
  contents: write
jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          DAYS_BACK: "2"
          MAX_N: "40"
          MCAP_MAX: "100000000"
        run: python scripts/concall_scan.py
      - name: Save scan data to the store
        if: always()
        run: |
          git config user.name market-content-bot && git config user.email bot@users.noreply.github.com
          git add store state/mcap_cache.json 2>/dev/null || true
          git diff --cached --quiet && exit 0
          git commit -q -m "Concall scan data (daily)"
          for i in 1 2 3; do git pull --rebase -q origin main && git push -q origin main && break; sleep 3; done
