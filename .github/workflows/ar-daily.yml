name: ar-daily
on:
  workflow_dispatch:
    inputs:
      nse_refresh:
        description: "1 = also refresh every NSE symbol (weekly)"
        default: "0"
  schedule:
    - cron: "40 17 * * *"
concurrency:
  group: ar-list
  cancel-in-progress: false
permissions:
  contents: write
jobs:
  c:
    runs-on: ubuntu-latest
    timeout-minutes: 175
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - name: BSE listing (last 21 days re-checked)
        env:
          BUDGET_MIN: "60"
        run: python scripts/ar_list_bse.py
      - name: NSE listing (full refresh on Mondays or when asked)
        env:
          BUDGET_MIN: "100"
          RESET: ${{ (github.event.inputs.nse_refresh == '1' || (github.event_name == 'schedule' && format('{0}', github.event.schedule) != '' && '0' == '1')) && '1' || '0' }}
        run: |
          if [ "${{ github.event.inputs.nse_refresh }}" = "1" ] || [ "$(date -u +%u)" = "1" ]; then export RESET=1; fi
          python scripts/ar_list_nse.py
      - name: Merge
        run: python scripts/ar_merge.py
      - name: Save
        if: always()
        run: |
          git config user.name market-content-bot && git config user.email bot@users.noreply.github.com
          git add store/annual_reports 2>/dev/null || true
          git diff --cached --quiet && exit 0
          git commit -q -m "Annual report listing (daily)"
          for i in 1 2 3 4; do git pull --rebase -q origin main && git push -q origin main && break; sleep 4; done
