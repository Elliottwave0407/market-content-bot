name: debug-quotes
on:
  workflow_dispatch:
    inputs:
      only:
        description: "company name parts, comma separated"
        default: "CIE Automotive,Piramal Finance,LMW,Metro Brands"
permissions:
  contents: read
jobs:
  d:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt
      - run: pip install -r requirements.txt
      - env:
          MISTRAL_API_KEY: ${{ secrets.MISTRAL_API_KEY }}
          NVIDIA_API_KEY: ${{ secrets.NVIDIA_API_KEY }}
          ONLY: ${{ github.event.inputs.only }}
        run: python scripts/debug_quotes.py
