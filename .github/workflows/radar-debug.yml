name: radar-debug
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  a:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt
      - run: pip install -r requirements.txt pandas numpy
      - env:
          SEND: "0"
        run: python scripts/radar_debug.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: radar
          path: out/esm_radar_sme.png
      - name: save NSE PE snapshot
        if: always()
        run: |
          git config user.name "bot"; git config user.email "bot@users.noreply.github.com"
          git add store/sme_eps/nse_pe.json || true
          git diff --cached --quiet || (git commit -m "NSE PE snapshot" && for i in 1 2 3; do git pull -q --rebase origin main && git push -q origin HEAD:main && break; done)
