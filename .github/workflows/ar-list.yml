name: ar-list
on:
  workflow_dispatch:
    inputs:
      which:
        description: "nse, bse or both"
        default: "both"
      limit:
        description: "test: only N NSE symbols / N BSE windows (0 = all)"
        default: "0"
      budget_min:
        default: "120"
concurrency:
  group: ar-list
  cancel-in-progress: false
permissions:
  contents: write
jobs:
  c:
    runs-on: ubuntu-latest
    timeout-minutes: 175
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - name: NSE listing
        if: github.event.inputs.which != 'bse'
        env:
          LIMIT: ${{ github.event.inputs.limit }}
          BUDGET_MIN: ${{ github.event.inputs.budget_min }}
        run: python scripts/ar_list_nse.py
      - name: BSE listing
        if: github.event.inputs.which != 'nse'
        env:
          LIMIT_WINDOWS: ${{ github.event.inputs.limit }}
          BUDGET_MIN: ${{ github.event.inputs.budget_min }}
        run: python scripts/ar_list_bse.py
      - name: Save
        if: always()
        run: |
          git config user.name market-content-bot && git config user.email bot@users.noreply.github.com
          git add store/annual_reports 2>/dev/null || true
          git diff --cached --quiet && exit 0
          git commit -q -m "Annual report listing"
          for i in 1 2 3 4; do git pull --rebase -q origin main && git push -q origin main && break; sleep 4; done
