name: esm-radar
on:
  workflow_dispatch:
    inputs:
      day:
        description: "effective date YYYY-MM-DD (blank = latest)"
        default: ""
      send:
        description: "type yes to send to the PRIVATE group (otherwise just builds the image)"
        default: "no"
permissions:
  contents: read
jobs:
  a:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt
      - run: pip install -r requirements.txt
      - env:
          DAY: ${{ github.event.inputs.day }}
          SEND: ${{ github.event.inputs.send == 'yes' && '1' || '0' }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python scripts/esm_radar.py
      - uses: actions/upload-artifact@v4
        with:
          name: radar
          path: out/esm_radar_sme.png
