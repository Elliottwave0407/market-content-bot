name: pilot-audit
on:
  workflow_dispatch:
    inputs:
      symbol:
        description: "NSE symbol"
        default: "E2E"
permissions:
  contents: write
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      SYMBOL: ${{ github.event.inputs.symbol }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - name: audit unaudited facts (1 call)
        run: python scripts/pillars_audit_missing.py
      - name: score report
        if: always()
        run: python scripts/strong_report.py
      - name: save data
        if: always()
        run: |
          git config user.name "market-bot"; git config user.email "bot@users.noreply.github.com"
          git add companydata
          git diff --cached --quiet || git commit -qm "data: audit missing ${{ github.event.inputs.symbol }}"
          for i in 1 2 3; do git pull -q --rebase origin main && git push -q origin HEAD:main && break || sleep 5; done
