name: tg-delete-card
on:
  workflow_dispatch:
    inputs:
      match:
        description: "text in the caption of the wrong card (e.g. Shilchar)"
        default: ""
      priv_id:
        description: "private chat message id to delete (optional)"
        default: ""
      confirm:
        description: "type yes to delete (anything else = dry run)"
        default: "no"
permissions:
  contents: read
jobs:
  a:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt
      - run: pip install -r requirements.txt
      - env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          TELEGRAM_PUBLIC_GROUP_ID: ${{ secrets.TELEGRAM_PUBLIC_GROUP_ID }}
          MATCH: ${{ github.event.inputs.match }}
          PRIV_ID: ${{ github.event.inputs.priv_id }}
          CONFIRM: ${{ github.event.inputs.confirm }}
        run: python scripts/tg_delete_card.py
