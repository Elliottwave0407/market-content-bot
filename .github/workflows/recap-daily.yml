name: recap-daily
on:
  schedule:
    - cron: "30 13 * * 1-5"      # 19:00 IST, Mon-Fri
  workflow_dispatch:
    inputs:
      day:
        description: "today or YYYY-MM-DD"
        default: "today"
      send:
        description: "1 = post to the Market group, 0 = dry run"
        default: "0"
      force:
        description: "1 = post even if already posted today"
        default: "0"
permissions:
  contents: write
concurrency:
  group: recap-daily
  cancel-in-progress: false
jobs:
  recap:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt
      - run: pip install -r requirements.txt
      - env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          MARKET_CHAT_ID: ${{ secrets.TELEGRAM_NEWS_CHAT_ID }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          X_BUTTON: "1"
          FORCE: ${{ github.event.inputs.force || '0' }}
        run: python scripts/recap_post.py "${{ github.event.inputs.day || 'today' }}" "${{ github.event.inputs.send || '1' }}" daily
      - name: Save state
        if: always()
        run: |
          git config user.name market-content-bot && git config user.email bot@users.noreply.github.com
          git add state/recap_posted.json store 2>/dev/null || true
          git diff --cached --quiet && exit 0
          git commit -q -m "Recap state"
          for i in 1 2 3; do git pull --rebase -q origin main && git push -q origin main && break; sleep 3; done
      - name: Publish preview PNG to the preview-cards branch
        if: always() && (github.event.inputs.send == '0')
        run: |
          set -e
          [ -d out ] || exit 0
          mkdir /tmp/pv && cp out/*.png /tmp/pv/ 2>/dev/null || exit 0
          cd /tmp/pv
          git init -q && git checkout -q -b preview-cards
          git config user.name market-content-bot && git config user.email bot@users.noreply.github.com
          git add . && git commit -q -m "preview cards"
          git push -q -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" preview-cards
