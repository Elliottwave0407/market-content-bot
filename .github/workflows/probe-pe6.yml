name: probe-pe6
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  a:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests
      - env:
          SYMS: "KORE,SAAKSHI,REFRACTORY,ESCONET,USHAFIN,INNOMET"
        run: python scripts/probe_pe6.py
