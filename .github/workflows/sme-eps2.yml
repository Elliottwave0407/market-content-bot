name: sme-eps2
on:
  workflow_dispatch:
    inputs:
      only:
        description: "symbols (comma), blank = all SME stocks in ESM"
        default: ""
permissions:
  contents: write
  actions: write
jobs:
  a:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt
      - run: pip install -r requirements.txt
      - env:
          ONLY: ${{ github.event.inputs.only }}
          NVIDIA_API_KEY: ${{ secrets.NVIDIA_API_KEY }}
        run: python scripts/sme_eps2.py
      - name: Save
        if: always()
        run: |
          git config user.name market-content-bot && git config user.email bot@users.noreply.github.com
          git add -A store/sme_eps 2>/dev/null || true
          git diff --cached --quiet && exit 0
          git commit -q -m "SME EPS/PE update"
          for i in 1 2 3 4; do git pull --rebase -q origin main && git push -q origin main && break; sleep 4; done
      - name: Continue if stocks remain
        if: github.event_name == 'workflow_dispatch' && github.event.inputs.only == ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "$(cat store/sme_eps/_more.flag 2>/dev/null)" = "1" ]; then
            gh api -X POST repos/${{ github.repository }}/actions/workflows/sme-eps2.yml/dispatches -f ref=main -f "inputs[only]="
          fi
