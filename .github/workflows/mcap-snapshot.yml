name: mcap-snapshot
on:
  workflow_dispatch:
  schedule:
    - cron: "10 14 * * 1-5"     # weekday 19:40 IST (posts nothing)
permissions:
  contents: write
concurrency:
  group: mcap-snapshot
  cancel-in-progress: false
jobs:
  a:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt
      - run: pip install -r requirements.txt
      - run: python scripts/mcap_snapshot.py
      - name: Save
        if: always()
        run: |
          git config user.name market-content-bot && git config user.email bot@users.noreply.github.com
          git add store/mcap 2>/dev/null || true
          git diff --cached --quiet && exit 0
          git commit -q -m "Market-cap snapshot"
          for i in 1 2 3 4; do git pull --rebase -q origin main && git push -q origin main && break; sleep 4; done
