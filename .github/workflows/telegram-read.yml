name: telegram-read
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  read:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests cryptography
      - name: Read Telegram group (stored encrypted)
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          FEEDBACK_KEY: ${{ secrets.FEEDBACK_KEY }}
        run: python scripts/telegram_read.py
      - name: Save encrypted feedback
        run: |
          git config user.name "market-content-bot"
          git config user.email "bot@users.noreply.github.com"
          mkdir -p feedback
          git add feedback
          git diff --cached --quiet || (git commit -m "Save encrypted feedback" && git pull --rebase -q origin main && git push -q origin main)
