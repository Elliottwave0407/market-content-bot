name: rule-validate
on:
  workflow_dispatch:
    inputs:
      days:
        description: "days back, comma separated"
        default: "1,2,3"
      maxn:
        description: "max filings"
        default: "150"
      only:
        description: "name fragments"
        default: ""
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt
      - run: pip install -r requirements.txt
      - env:
          DAYS: ${{ github.event.inputs.days }}
          MAXN: ${{ github.event.inputs.maxn }}
          ONLY: ${{ github.event.inputs.only }}
        run: python scripts/rule_validate.py
