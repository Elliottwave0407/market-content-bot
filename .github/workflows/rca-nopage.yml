# read-only RCA of "no results table page" failures
name: rca-nopage
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  rca:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install pymupdf
      - run: python scripts/rca_nopage.py
        env:
          SHARD: ${{ matrix.shard }}
          NSH: "3"
