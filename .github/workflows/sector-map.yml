name: sector-map
on:
  workflow_dispatch:
    inputs:
      budget_min:
        description: "minutes to spend on Yahoo lookups"
        default: "40"
permissions:
  contents: write
concurrency:
  group: sector-map
  cancel-in-progress: false
jobs:
  a:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt
      - run: pip install -r requirements.txt
      - env:
          BUDGET_MIN: ${{ github.event.inputs.budget_min || '40' }}
        run: python scripts/sector_map.py
      - name: Save sector map
        if: always()
        run: |
          git config user.name market-content-bot && git config user.email bot@users.noreply.github.com
          git add store/sector_map 2>/dev/null || true
          git diff --cached --quiet && exit 0
          git commit -q -m "Sector map update"
          for i in 1 2 3 4; do git pull --rebase -q origin main && git push -q origin main && break; sleep 4; done
