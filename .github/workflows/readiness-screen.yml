name: Readiness Screen
on:
  workflow_dispatch:
    inputs:
      symbols:
        description: "Optional comma list of NSE symbols (blank = scan a market-cap band)"
        default: ""
      mcap_min:
        default: "2000"
      mcap_max:
        default: "60000"
      debug:
        default: "0"
      top:
        description: "How many candidates (largest first)"
        default: "120"
permissions:
  contents: write
jobs:
  screen:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - env:
          SYMBOLS: ${{ github.event.inputs.symbols }}
          MCAP_MIN: ${{ github.event.inputs.mcap_min }}
          MCAP_MAX: ${{ github.event.inputs.mcap_max }}
          TOP: ${{ github.event.inputs.top }}
          DEBUG: ${{ github.event.inputs.debug }}
        run: python scripts/readiness_screen.py
      - name: save result
        if: always()
        run: |
          git config user.name "market-bot"; git config user.email "bot@users.noreply.github.com"
          git add -f companydata/_readiness
          git diff --cached --quiet || git commit -qm "data: readiness screen"
          for i in 1 2 3; do git pull -q --rebase origin main && git push -q origin HEAD:main && break || sleep 5; done
