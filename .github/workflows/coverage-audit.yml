# read-only: universe vs cards (posts nothing)
name: coverage-audit
on:
  workflow_dispatch:
    inputs:
      start:
        default: "2026-10-15"
      end:
        default: "2026-11-14"
permissions:
  contents: read
jobs:
  a:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt
      - run: pip install -r requirements.txt
      - env:
          START: ${{ github.event.inputs.start }}
          END: ${{ github.event.inputs.end }}
        run: python scripts/coverage_audit.py
