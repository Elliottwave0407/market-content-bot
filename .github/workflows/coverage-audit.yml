# read-only: universe vs cards (posts nothing)
name: coverage-audit
on:
  schedule:
    - cron: "17,47 * * * *"
  workflow_dispatch:
    inputs:
      start:
        default: ""
      end:
        default: ""
permissions:
  contents: write
jobs:
  a:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt
      - run: pip install -r requirements.txt
      - env:
          START: ${{ github.event.inputs.start }}
          END: ${{ github.event.inputs.end }}
          WRITE: "1"
        run: |
          python scripts/coverage_audit.py
          git config user.name market-content-bot && git config user.email bot@users.noreply.github.com
          git add state/uncovered.json && git commit -qm "Coverage watch" || exit 0
          for t in 1 2 3 4; do git pull -q --rebase && git push -q && break; sleep 3; done
