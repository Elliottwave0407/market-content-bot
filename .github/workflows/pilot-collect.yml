name: pilot-collect
on:
  workflow_dispatch:
    inputs:
      symbol:
        description: "NSE symbol"
        default: "E2E"
      scrip:
        description: "BSE scrip code"
        default: "544783"
      cname:
        description: "Company name"
        default: "E2E Networks Limited"
      judge:
        description: "Run the (quota-costly) judge step: 1 or 0"
        default: "0"
permissions:
  contents: write
jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          SYMBOL: ${{ github.event.inputs.symbol }}
          SCRIP: ${{ github.event.inputs.scrip }}
          CNAME: ${{ github.event.inputs.cname }}
          JUDGE: ${{ github.event.inputs.judge }}
        run: python scripts/pilot_build.py
      - name: save data
        run: |
          git config user.name "market-bot"; git config user.email "bot@users.noreply.github.com"
          git add data
          git diff --cached --quiet || git commit -qm "data: refresh ${{ github.event.inputs.symbol }}"
          for i in 1 2 3; do git pull -q --rebase origin main && git push -q origin HEAD:main && break || sleep 5; done
