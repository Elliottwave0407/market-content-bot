# read-only: how much of the result flow has structured XBRL on NSE (posts nothing)
name: xbrl-coverage-probe
on:
  workflow_dispatch:
    inputs:
      days:
        default: "2026-11-13,2026-11-14"
      maxn:
        default: "120"
      only_sme:
        default: "0"
permissions:
  contents: read
jobs:
  a:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt
      - run: pip install -r requirements.txt
      - env:
          DAYS: ${{ github.event.inputs.days }}
          MAXN: ${{ github.event.inputs.maxn }}
          ONLY_SME: ${{ github.event.inputs.only_sme }}
        run: python scripts/xbrl_coverage_probe.py
