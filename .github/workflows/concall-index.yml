name: concall-index
on:
  workflow_dispatch:
    inputs:
      cur_from:
        description: "Current window start (YYYY-MM-DD)"
        default: "2026-10-06"
      cur_to:
        description: "Current window end (blank = today)"
        default: ""
      hist_from:
        description: "Backfill mode: first day to fetch and count (blank = normal report run)"
        default: ""
      hist_to:
        description: "Backfill mode: last day"
        default: ""
      ranges:
        description: "Backfill queue: 'FROM TO;FROM TO;...' run one after another in this job (overrides hist_from/hist_to)"
        default: ""
concurrency:
  group: concall-index
  cancel-in-progress: false
permissions:
  contents: write
jobs:
  index:
    runs-on: ubuntu-latest
    timeout-minutes: 330
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - env:
          CUR_FROM: ${{ github.event.inputs.cur_from }}
          CUR_TO: ${{ github.event.inputs.cur_to }}
          HIST_FROM: ${{ github.event.inputs.hist_from }}
          HIST_TO: ${{ github.event.inputs.hist_to }}
          RANGES: ${{ github.event.inputs.ranges }}
        run: |
          git config user.name market-content-bot && git config user.email bot@users.noreply.github.com
          if [ -n "$RANGES" ]; then
            IFS=';' read -ra A <<< "$RANGES"
            for r in "${A[@]}"; do
              set -- $r
              HIST_FROM=$1 HIST_TO=$2 python scripts/concall_themes.py || true
              git add store/concall_themes 2>/dev/null || true
              git diff --cached --quiet || { git commit -q -m "Concall theme counts $1 to $2"; for i in 1 2 3 4; do git pull --rebase -q origin main && git push -q origin main && break; sleep 4; done; }
            done
          else
            python scripts/concall_themes.py
          fi
      - name: Save theme counts to the store
        if: always()
        run: |
          git config user.name market-content-bot && git config user.email bot@users.noreply.github.com
          git add store/concall_themes 2>/dev/null || true
          git diff --cached --quiet && exit 0
          git commit -q -m "Concall theme counts"
          for i in 1 2 3 4; do git pull --rebase -q origin main && git push -q origin main && break; sleep 4; done
