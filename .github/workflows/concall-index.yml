name: concall-index
on:
  workflow_dispatch:
    inputs:
      cur_from:
        description: "Current window start (YYYY-MM-DD)"
        default: "2026-10-06"
      cur_to:
        description: "Current window end (blank = today)"
        default: ""
concurrency:
  group: concall-index
  cancel-in-progress: false
permissions:
  contents: write
jobs:
  index:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - env:
          CUR_FROM: ${{ github.event.inputs.cur_from }}
          CUR_TO: ${{ github.event.inputs.cur_to }}
        run: python scripts/concall_themes.py
      - name: Save theme counts to the store
        if: always()
        run: |
          git config user.name market-content-bot && git config user.email bot@users.noreply.github.com
          git add store/concall_themes 2>/dev/null || true
          git diff --cached --quiet && exit 0
          git commit -q -m "Concall theme counts"
          for i in 1 2 3; do git pull --rebase -q origin main && git push -q origin main && break; sleep 3; done
