name: nse-preview-dry
on:
  workflow_dispatch:
    inputs:
      n:
        description: "how many stubs"
        default: "12"
      syms:
        description: "optional NSE symbols, comma separated"
        default: ""
permissions:
  contents: write
jobs:
  d:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - name: Preview cards (nothing is posted)
        env:
          N: ${{ github.event.inputs.n }}
          SYMS: ${{ github.event.inputs.syms }}
        run: python scripts/nse_preview_dry.py
      - name: Save previews
        if: always()
        run: |
          mkdir -p store/stub_dry/preview && cp out/nse_preview/*.png store/stub_dry/preview/ 2>/dev/null || true
          git config user.name market-content-bot && git config user.email bot@users.noreply.github.com
          git add store/stub_dry/preview 2>/dev/null || true
          git diff --cached --quiet && exit 0
          git commit -q -m "NSE backup preview cards (dry)"
          for i in 1 2 3 4; do git pull --rebase -q origin main && git push -q origin main && break; sleep 4; done
