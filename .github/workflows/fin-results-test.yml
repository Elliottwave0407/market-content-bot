name: fin-results-test
on:
  workflow_dispatch:
    inputs:
      day:
        description: "YYYY-MM-DD (IST) of bank/insurer filings to dry-run"
        default: "2026-07-18"
      maxn:
        description: "max filings to read (cards to build)"
        default: "4"
permissions:
  contents: write
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt
      - run: pip install -r requirements.txt
      - env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          FIN_SEND: "0"
          FIN_FORCE_PDF: "1"
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          FIN_DAY: ${{ github.event.inputs.day }}
          FIN_MAX: ${{ github.event.inputs.maxn }}
        run: python scripts/fin_results.py
      - name: Publish preview PNG to the preview-cards branch
        if: always()
        run: |
          set -e
          [ -d out ] || exit 0
          mkdir /tmp/pv && cp out/*.png /tmp/pv/ 2>/dev/null || exit 0
          cd /tmp/pv
          git init -q && git checkout -q -b preview-cards
          git config user.name market-content-bot && git config user.email bot@users.noreply.github.com
          git add . && git commit -q -m "preview cards"
          git push -q -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" preview-cards
