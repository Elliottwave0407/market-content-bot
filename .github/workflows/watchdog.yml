name: watchdog
# Restarts a stalled work chain: if a chain workflow has nothing running or queued but its state file says work remains, dispatch it again.
on:
  workflow_dispatch:
  schedule:
    - cron: "11,41 * * * *"
concurrency:
  group: watchdog
  cancel-in-progress: false
permissions:
  contents: read
  actions: write
jobs:
  w:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Restart stalled chains
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          R=${{ github.repository }}
          active() { gh api "repos/$R/actions/workflows/$1.yml/runs?per_page=20" -q '[.workflow_runs[]|select(.status!="completed")]|length' 2>/dev/null || echo 9; }
          left() { python3 -c "import json,sys;d=json.load(open('$1'));print(d.get('remaining',0) if d.get('progressed',0)>0 else 0)" 2>/dev/null || echo 0; }
          EX=$(active concall-extract); echo "concall-extract active: $EX"
          # 1. presentations
          N=$(left store/ppt_facts/_state.json); A=$(active ppt-ingest); echo "ppt-ingest remaining=$N active=$A"
          if [ "$N" -gt 0 ] && [ "$A" -eq 0 ]; then gh api -X POST repos/$R/actions/workflows/ppt-ingest.yml/dispatches -f ref=main -f 'inputs[dry]=0' -f 'inputs[maxn]=0' -f 'inputs[budget_min]=150' -f 'inputs[workers]=10' && echo "restarted ppt-ingest"; fi
          # 2. concall re-read (yields to fresh filings)
          N=$(left store/concall_reread/_state_v3.json); A=$(active concall-reread); echo "concall-reread remaining=$N active=$A"
          if [ "$N" -gt 0 ] && [ "$A" -eq 0 ] && [ "$EX" -eq 0 ]; then gh api -X POST repos/$R/actions/workflows/concall-reread.yml/dispatches -f ref=main -f 'inputs[dry]=0' -f 'inputs[maxn]=0' -f 'inputs[budget_min]=150' -f 'inputs[workers]=6' -f 'inputs[schema_v]=3' && echo "restarted concall-reread"; fi
          # 3. NSE-gap concall reads
          N=$(left store/concall_coverage/_ingest_state.json); A=$(active concall-nse-ingest); echo "concall-nse-ingest remaining=$N active=$A"
          if [ "$N" -gt 0 ] && [ "$A" -eq 0 ]; then gh api -X POST repos/$R/actions/workflows/concall-nse-ingest.yml/dispatches -f ref=main -f 'inputs[dry]=0' -f 'inputs[maxn]=0' -f 'inputs[budget_min]=150' -f 'inputs[workers]=8' -f 'inputs[statuses]=nse_only,bse_listed_missing,covered_but_skipped' && echo "restarted concall-nse-ingest"; fi
