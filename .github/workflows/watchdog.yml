name: watchdog
# Restarts a stalled work chain: if a chain workflow has nothing running or queued but its state file says work remains, dispatch it again.
on:
  workflow_dispatch:
  schedule:
    - cron: "11,41 * * * *"
concurrency:
  group: watchdog
  cancel-in-progress: false
permissions:
  contents: read
  actions: write
jobs:
  w:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Start the next engine if none is running (one NVIDIA engine at a time)
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash scripts/next_engine.sh watchdog
