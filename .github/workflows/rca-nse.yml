# read-only RCA of NSE result PDFs by symbol (posts nothing)
name: rca-nse
on:
  workflow_dispatch:
    inputs:
      syms:
        default: "ONELIFECAP,TEXMOPIPES,NECLIFE,STCINDIA,JPOLYINVST"
      start:
        default: "2026-11-10"
      end:
        default: "2026-11-18"
      rows:
        default: ""
      pages:
        default: ""
      ocrrows:
        default: ""
      summaryrows:
        default: ""
permissions:
  contents: read
jobs:
  a:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt
      - run: pip install -r requirements.txt rapidocr-onnxruntime
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq tesseract-ocr tesseract-ocr-eng
      - env:
          SYMS: ${{ github.event.inputs.syms }}
          START: ${{ github.event.inputs.start }}
          END: ${{ github.event.inputs.end }}
          ROWS: ${{ github.event.inputs.rows }}
          PAGES: ${{ github.event.inputs.pages }}
          OCRROWS: ${{ github.event.inputs.ocrrows }}
          SUMMARYROWS: ${{ github.event.inputs.summaryrows }}
          RULE_OCR_ENGINE: rapid
          RULE_OCR: "1"
          NSE_SME: "1"
        run: python scripts/rca_nse.py
