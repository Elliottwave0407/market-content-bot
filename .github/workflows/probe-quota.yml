name: probe-quota
on:
  workflow_dispatch:
    inputs:
      models:
        description: "comma-separated model ids (blank = all)"
        default: "gemini-flash-latest,gemini-3.5-flash"
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      MODELS: ${{ github.event.inputs.models }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - run: cd scripts && python probe_quota.py
