name: prices-check
on:
  workflow_dispatch:
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests pandas numpy
      - uses: actions/cache@v4
        with:
          path: data/prices
          key: nse-prices-${{ github.run_id }}
          restore-keys: nse-prices-
      - run: python scripts/prices_check.py
