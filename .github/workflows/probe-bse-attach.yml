name: probe-bse-attach
on:
  workflow_dispatch:
    inputs:
      from_day:
        description: "first day to check"
        default: "2024-04-01"
      budget_min:
        default: "140"
concurrency:
  group: probe-bse-attach
  cancel-in-progress: false
permissions:
  contents: read
jobs:
  c:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - env:
          FROM: ${{ github.event.inputs.from_day }}
          BUDGET_MIN: ${{ github.event.inputs.budget_min }}
        run: python scripts/probe_bse_attach.py
