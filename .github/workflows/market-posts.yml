name: market-posts
on:
  workflow_dispatch:
    inputs:
      mode:
        description: "fii, deals or both"
        default: "both"
      send:
        description: "1 = post to Telegram group, 0 = dry run (PNGs only)"
        default: "0"
      force:
        description: "1 = ignore the already-posted check (preview)"
        default: "0"
      xbutton:
        description: "1 = add a Post to X button under cards"
        default: "0"
permissions:
  contents: write
concurrency:
  group: market-posts
  cancel-in-progress: false
jobs:
  post:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt
      - run: pip install -r requirements.txt
      - name: Build and (optionally) post
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          MARKET_CHAT_ID: ${{ secrets.TELEGRAM_NEWS_CHAT_ID }}
          TELEGRAM_PUBLIC_GROUP_ID: ${{ secrets.TELEGRAM_PUBLIC_GROUP_ID }}   # FinGod group copy of FII/DII and deals (optional)
          POST_SEND: ${{ github.event.inputs.send || '0' }}
          POST_FORCE: ${{ github.event.inputs.force || '0' }}
          X_BUTTON: ${{ github.event.inputs.xbutton || '0' }}
        run: python scripts/market_posts.py "${{ github.event.inputs.mode || 'both' }}"
      - name: Publish preview PNGs (dry runs only)
        if: always() && github.event.inputs.send != '1'
        run: |
          set -e
          [ -d out ] || exit 0
          mkdir /tmp/pv && cp out/*.png /tmp/pv/ 2>/dev/null || exit 0
          cd /tmp/pv
          git init -q && git checkout -q -b preview-cards
          git config user.name market-content-bot && git config user.email bot@users.noreply.github.com
          git add . && git commit -q -m "preview cards"
          git push -q -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" preview-cards
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: market-cards
          path: out/*.png
          if-no-files-found: ignore
