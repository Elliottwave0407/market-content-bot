name: ppt-vision
on:
  workflow_dispatch:
    inputs:
      n:
        description: "presentations in this run"
        default: "10"
      key_env:
        description: "secret lane: GEMINI_API_KEY_CONCALL or GEMINI_API_KEY_RESULTS"
        default: "GEMINI_API_KEY_CONCALL"
permissions:
  contents: write
concurrency:
  group: ppt-vision
  cancel-in-progress: false
jobs:
  v:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt
      - run: pip install -r requirements.txt
      - env:
          GEMINI_API_KEY_CONCALL: ${{ secrets.GEMINI_API_KEY_CONCALL }}
          GEMINI_API_KEY_RESULTS: ${{ secrets.GEMINI_API_IMAGE_SCANNED_RESULTS }}
          KEY_ENV: ${{ github.event.inputs.key_env || 'GEMINI_API_KEY_CONCALL' }}
          N: ${{ github.event.inputs.n || '10' }}
        run: python scripts/ppt_vision.py
      - name: Save
        if: always()
        run: |
          git config user.name market-content-bot && git config user.email bot@users.noreply.github.com
          git add store/ppt_vision 2>/dev/null || true
          git diff --cached --quiet && exit 0
          git commit -q -m "Presentation vision pilot"
          for i in 1 2 3 4; do git pull --rebase -q origin main && git push -q origin main && break; sleep 4; done
