name: gemini-feasibility
on:
  workflow_dispatch:
    inputs:
      model:
        description: "Gemini model id (blank = auto flash-lite)"
        required: false
        default: ""
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/cache@v4
        with:
          path: .pdfcache
          key: pdfcache-${{ github.run_id }}
          restore-keys: pdfcache-
      - run: pip install bse requests
      - run: python scripts/gemini_feasibility.py
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: ${{ github.event.inputs.model }}
