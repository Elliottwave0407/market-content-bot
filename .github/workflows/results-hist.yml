name: results-hist
on:
  workflow_dispatch:
    inputs:
      dry:
        default: "1"
      maxn:
        default: "40"
      budget_min:
        default: "150"
concurrency:
  group: results-hist
  cancel-in-progress: false
permissions:
  contents: write
  actions: write
jobs:
  r:
    runs-on: ubuntu-latest
    timeout-minutes: 175
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - env:
          DRY: ${{ github.event.inputs.dry }}
          MAXN: ${{ github.event.inputs.maxn }}
          BUDGET_MIN: ${{ github.event.inputs.budget_min }}
        run: python scripts/results_hist.py
      - name: Save
        if: always()
        run: |
          git config user.name market-content-bot && git config user.email bot@users.noreply.github.com
          git add store/results_hist 2>/dev/null || true; git add store/results_hist_dry 2>/dev/null || true
          git diff --cached --quiet && exit 0
          git commit -q -m "Results history listing"
          for i in 1 2 3 4; do git pull --rebase -q origin main && git push -q origin main && break; sleep 4; done
