name: pdf-feasibility2
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq tesseract-ocr
      - run: pip install bse requests pymupdf
      - run: python scripts/pdf_feasibility2.py
