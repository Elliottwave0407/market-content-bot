name: vision-compare
on:
  workflow_dispatch:
    inputs:
      n:
        default: "40"
      nv_models:
        description: "blank = auto-discover"
        default: ""
      gemini:
        default: "gemini-2.5-flash-lite,gemini-2.5-flash"
      mistral:
        default: "ministral-14b-latest"
permissions:
  contents: read
concurrency:
  group: vision-compare
jobs:
  c:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - env:
          NVIDIA_API_KEY: ${{ secrets.NVIDIA_API_KEY }}
          MISTRAL_API_KEY: ${{ secrets.MISTRAL_API_KEY }}
          GEMINI_API_KEY_CONCALL: ${{ secrets.GEMINI_API_KEY_CONCALL }}
          N_SLIDES: ${{ github.event.inputs.n }}
          NV_MODELS: ${{ github.event.inputs.nv_models }}
          GEMINI: ${{ github.event.inputs.gemini }}
          MISTRAL: ${{ github.event.inputs.mistral }}
          WORKERS: "3"
        run: python scripts/vision_compare.py
