# read-only diagnosis of stub results (posts nothing)
name: results-stub-probe
on:
  workflow_dispatch:
    inputs:
      days:
        description: "BSE look-back days"
        default: "12"
      n:
        description: "max filings"
        default: "60"
      only:
        description: "BSE codes, comma separated (blank = all stubs)"
        default: ""
      nim:
        description: "1 = also try the NVIDIA text reader"
        default: "1"
permissions:
  contents: read
concurrency:
  group: results-stub-probe
  cancel-in-progress: false
jobs:
  a:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt
      - run: pip install -r requirements.txt
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq tesseract-ocr
      - env:
          DAYS: ${{ github.event.inputs.days || '12' }}
          N: ${{ github.event.inputs.n || '60' }}
          ONLY: ${{ github.event.inputs.only }}
          NIM: ${{ github.event.inputs.nim || '1' }}
          DUMP: "1"
          NVIDIA_API_KEY: ${{ secrets.NVIDIA_API_KEY }}
          GEM: "1"
          MISTRAL_OCR: "1"
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_API_KEY_OVERFLOW: ${{ secrets.GEMINI_API_KEY_CONCALL }}
          GEMINI_API_KEY_RESULTS: ${{ secrets.GEMINI_API_IMAGE_SCANNED_RESULTS }}
          MISTRAL_API_KEY: ${{ secrets.MISTRAL_API_KEY }}
        run: python scripts/stub_diag.py
