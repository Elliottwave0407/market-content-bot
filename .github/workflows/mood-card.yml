name: mood-card
on:
  workflow_dispatch:
    inputs:
      send:
        description: "1 = send to the market group, 0 = dry run (preview branch)"
        default: "0"
permissions:
  contents: write
jobs:
  mood:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt pandas numpy
      - uses: actions/cache@v4
        with:
          path: data/prices2
          key: univ-prices-${{ github.run_id }}
          restore-keys: univ-prices-
      - env:
          MOOD_SEND: ${{ github.event.inputs.send }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          MARKET_CHAT_ID: ${{ secrets.TELEGRAM_NEWS_CHAT_ID }}
          POST_SEND: ${{ github.event.inputs.send }}
          X_BUTTON: "1"
        run: python scripts/mood_post.py
      - name: Publish preview PNG to the preview-cards branch
        if: always() && github.event.inputs.send != '1'
        run: |
          set -e
          [ -d out ] || exit 0
          mkdir /tmp/pv && cp out/*.png /tmp/pv/ 2>/dev/null || exit 0
          cd /tmp/pv
          git init -q && git checkout -q -b preview-cards
          git config user.name market-content-bot && git config user.email bot@users.noreply.github.com
          git add . && git commit -q -m "preview cards"
          git push -q -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" preview-cards
