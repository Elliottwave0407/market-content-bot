name: send-guide
on:
  workflow_dispatch:
jobs:
  send:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - env:
          T: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          A: ${{ secrets.TELEGRAM_CHAT_ID }}
          B: ${{ secrets.TELEGRAM_NEWS_CHAT_ID }}
        run: |
          for c in "$A" "$B"; do
            curl -s -X POST "https://api.telegram.org/bot$T/sendMessage" --data-urlencode "chat_id=$c" --data-urlencode "text@drafts/button_guide.txt" | python3 -c "import sys,json; print('ok', json.load(sys.stdin).get('ok'))"
          done
