name: send-guide
on:
  workflow_dispatch:
jobs:
  send:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - env:
          T: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          A: ${{ secrets.TELEGRAM_CHAT_ID }}
          B: ${{ secrets.TELEGRAM_NEWS_CHAT_ID }}
        run: python scripts/send_guide.py
