name: results-test
on:
  workflow_dispatch:
    inputs:
      only:
        description: "company name fragments, comma separated (e.g. TRIL,SEJAL)"
        default: ""
      send:
        description: "1 = send to Results Corner, 0 = dry run"
        default: "0"
      days:
        description: "how many days back to look"
        default: "2"
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt
      - run: pip install -r requirements.txt
      - env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          PDF_TRIES: "4"
          POLL_SEND: ${{ github.event.inputs.send }}
          POLL_ONLY: ${{ github.event.inputs.only }}
          POLL_DAYS: ${{ github.event.inputs.days }}
        run: python scripts/results_poller.py
