name: results-upgrade-dry
on:
  workflow_dispatch:
    inputs:
      days:
        description: "days back"
        default: "5"
permissions:
  contents: write
jobs:
  a:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq fonts-dejavu-core >/dev/null 2>&1 || true
          pip install -r requirements.txt
      - env:
          DAYS: ${{ github.event.inputs.days || '5' }}
        run: python scripts/results_upgrade.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: upgrade-cards
          path: out/upgrade/
          if-no-files-found: ignore
      - name: Save card pictures to the repo (dry-run review only)
        if: always()
        run: |
          git config user.name market-content-bot && git config user.email bot@users.noreply.github.com
          mkdir -p drafts/upgrade_dry && cp -f out/upgrade/*.png drafts/upgrade_dry/ 2>/dev/null || true
          git add -f drafts/upgrade_dry 2>/dev/null || true
          git diff --cached --quiet && exit 0
          git commit -q -m "Upgrade dry-run cards (review only)"
          for i in 1 2 3 4; do git pull --rebase -q origin main && git push -q origin main && break; sleep 4; done
