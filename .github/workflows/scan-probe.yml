name: scan-probe
on:
  workflow_dispatch:
    inputs:
      docs:
        description: "NAME:file.pdf comma list (BSE AttachLive names)"
        default: "SCILAL:28885cb7-5ab7-40fe-a8ac-ffe0e16feae5.pdf,WELSPUN:243d4204-240b-45d5-b91f-fbb3d6722125.pdf,BHAGERIA:8f6f65c1-bf8f-41e8-8604-4ec2c8da31f1.pdf"
permissions:
  contents: read
jobs:
  a:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt
      - run: pip install -r requirements.txt
      - env:
          GEMINI_API_KEY_RESULTS: ${{ secrets.GEMINI_API_IMAGE_SCANNED_RESULTS }}
          DOCS: ${{ github.event.inputs.docs }}
        run: python scripts/scan_probe.py
