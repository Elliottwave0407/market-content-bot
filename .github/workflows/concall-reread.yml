name: concall-reread
on:
  workflow_dispatch:
    inputs:
      dry:
        description: "1 = read and log only, change nothing"
        default: "1"
      maxn:
        description: "Stop after N transcripts (0 = no limit)"
        default: "6"
      budget_min:
        description: "Minutes of work in this run"
        default: "150"
      workers:
        description: "Parallel readers"
        default: "6"
      schema_v:
        description: "Reader version to bring every record up to (2 = old v1 pass, 3 = wider category set)"
        default: "2"
concurrency:
  group: ${{ (github.event.inputs.dry || '1') == '1' && 'concall-reread-dry' || 'concall-extract-concall_facts' }}
  cancel-in-progress: false
permissions:
  contents: write
  actions: write
jobs:
  reread:
    runs-on: ubuntu-latest
    timeout-minutes: 175
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - env:
          NVIDIA_API_KEY: ${{ secrets.NVIDIA_API_KEY }}
          MISTRAL_API_KEY: ${{ secrets.MISTRAL_API_KEY }}
          DRY: ${{ github.event.inputs.dry || '1' }}
          SCHEMA_V: ${{ github.event.inputs.schema_v || '2' }}
          MODELS: "nvidia/nemotron-3-ultra-550b-a55b"
          MAXN: ${{ github.event.inputs.maxn || '6' }}
          BUDGET_MIN: ${{ github.event.inputs.budget_min || '150' }}
          WORKERS: ${{ github.event.inputs.workers || '6' }}
        run: python scripts/concall_reread.py
      - name: Save
        if: always()
        run: bash scripts/safe_push.sh "Concall re-read" store/concall_facts store/concall_reread
      - name: Hand over to the next engine (one NVIDIA engine at a time)
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          [ "${{ github.event.inputs.dry || '1' }}" = "1" ] && { echo "dry run: no chaining"; exit 0; }
          bash scripts/next_engine.sh concall-reread
