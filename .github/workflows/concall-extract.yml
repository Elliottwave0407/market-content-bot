name: concall-extract
on:
  workflow_dispatch:
    inputs:
      budget_min:
        description: "Minutes of work in this run"
        default: "150"
      floor:
        description: "Oldest day to go back to"
        default: "2024-04-01"
      out_dir:
        description: "Store folder (use concall_facts_m20 for a dry run)"
        default: "concall_facts"
      maxn:
        description: "Stop after N new transcripts (0 = no limit)"
        default: "0"
      workers:
        description: "Parallel readers"
        default: "3"
  schedule:
    - cron: "10 */3 * * *"
concurrency:
  group: concall-extract-${{ github.event.inputs.out_dir || 'concall_facts' }}
  cancel-in-progress: false
permissions:
  contents: write
  actions: write
jobs:
  extract:
    runs-on: ubuntu-latest
    timeout-minutes: 175
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - env:
          NVIDIA_API_KEY: ${{ secrets.NVIDIA_API_KEY }}
          MISTRAL_API_KEY: ${{ secrets.MISTRAL_API_KEY }}
          OUT_DIR: ${{ github.event.inputs.out_dir || 'concall_facts' }}
          MAXN: ${{ github.event.inputs.maxn || '0' }}
          BUDGET_MIN: ${{ github.event.inputs.budget_min || '150' }}
          FLOOR: ${{ github.event.inputs.floor || '2024-04-01' }}
          WORKERS: ${{ github.event.inputs.workers || '3' }}
        run: python scripts/concall_extract.py
      - name: Save facts to the store
        if: always()
        run: |
          git config user.name market-content-bot && git config user.email bot@users.noreply.github.com
          git add store/concall_facts store/concall_facts_m20 2>/dev/null || true
          git diff --cached --quiet && exit 0
          git commit -q -m "Concall facts"
          for i in 1 2 3 4; do git pull --rebase -q origin main && git push -q origin main && break; sleep 4; done
      - name: Chain the next run while old days remain
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          FLOOR: ${{ github.event.inputs.floor || '2024-04-01' }}
        run: |
          [ "${{ github.event.inputs.out_dir || 'concall_facts' }}" != "concall_facts" ] && { echo "dry run: no chaining"; exit 0; }
          B=$(python3 -c "import json;print(json.load(open('store/concall_facts/_cursor.json'))['back'])" 2>/dev/null || echo "")
          echo "back cursor: $B floor: $FLOOR"
          if [ -n "$B" ] && [ "$B" \> "$FLOOR" ]; then
            sleep 20
            gh api -X POST repos/${{ github.repository }}/actions/workflows/concall-extract.yml/dispatches -f ref=main && echo "next run queued"
          fi
